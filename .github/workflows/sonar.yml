# Análisis estático con SonarCloud (gratuito para repositorios públicos).
# Analiza backend (.NET) y frontend (TypeScript/React) en un solo proyecto y falla si hay
# bugs, vulnerabilidades o security hotspots pendientes.
name: sonar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar organización y proyecto de SonarCloud
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::Falta el secreto SONAR_TOKEN (ver README, sección 5)"; exit 1; fi
          auth=(-H "Authorization: Bearer $SONAR_TOKEN")
          if [ -z "$SONAR_ORGANIZATION" ]; then
            SONAR_ORGANIZATION=$(curl -sf "${auth[@]}" "$SONAR_HOST_URL/api/organizations/search?member=true" | jq -r '.organizations[0].key // empty')
            [ -n "$SONAR_ORGANIZATION" ] || { echo "::error::El token no pertenece a ninguna organización de SonarCloud"; exit 1; }
            echo "SONAR_ORGANIZATION=$SONAR_ORGANIZATION" >> "$GITHUB_ENV"
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            SONAR_PROJECT_KEY="subasta-jhonyvargas"
            echo "SONAR_PROJECT_KEY=$SONAR_PROJECT_KEY" >> "$GITHUB_ENV"
          fi
          # Crea el proyecto si aún no existe (público = gratuito)
          curl -s -o /dev/null "${auth[@]}" -X POST "$SONAR_HOST_URL/api/projects/create" \
            --data-urlencode "organization=$SONAR_ORGANIZATION" --data-urlencode "project=$SONAR_PROJECT_KEY" \
            --data-urlencode "name=Subasta en Linea" --data-urlencode "visibility=public" || true
          echo "Proyecto SonarCloud: $SONAR_HOST_URL/project/overview?id=$SONAR_PROJECT_KEY"

      - name: Instalar Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Instalar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Instalar SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Iniciar análisis
        run: >
          dotnet-sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="$SONAR_HOST_URL"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE"
          /d:sonar.scanner.scanAll=true
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,docs/**,reports/**,TestResults/**,**/Migrations/**,backend/tools/**,.github/**"
          /d:sonar.coverage.exclusions="frontend/**,backend/tests/**,**/Program.cs,**/Migrations/**,infra/**"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=600

      - name: Compilar
        run: dotnet build backend/Subasta.sln -c Release

      - name: Pruebas unitarias e integración con cobertura
        run: >
          dotnet test backend/Subasta.sln -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Finalizar análisis (espera el Quality Gate)
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Reporte de bugs, vulnerabilidades y security hotspots
        if: always()
        run: |
          mkdir -p reports/sonar
          api="$SONAR_HOST_URL/api"
          get() { curl -sS -H "Authorization: Bearer $SONAR_TOKEN" "$api/$1" -o "reports/sonar/$2"; }
          get "measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,ncloc" measures.json
          get "qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}" quality-gate.json
          get "issues/search?componentKeys=${SONAR_PROJECT_KEY}&types=BUG,VULNERABILITY&resolved=false&ps=500" issues.json
          get "hotspots/search?projectKey=${SONAR_PROJECT_KEY}&status=TO_REVIEW&ps=500" hotspots.json

          metric() { jq -r --arg k "$1" '[.component.measures[]? | select(.metric==$k) | .value][0] // "n/d"' reports/sonar/measures.json; }
          gate=$(jq -r '.projectStatus.status // "n/d"' reports/sonar/quality-gate.json)
          bugs=$(metric bugs); vulns=$(metric vulnerabilities); hotspots=$(jq -r '.paging.total // "n/d"' reports/sonar/hotspots.json)
          {
            echo "## Reporte SonarCloud"
            echo "| Métrica | Valor |"
            echo "|---|---|"
            echo "| Quality Gate | $gate |"
            echo "| Bugs | $bugs |"
            echo "| Vulnerabilidades | $vulns |"
            echo "| Security hotspots por revisar | $hotspots |"
            echo "| Code smells | $(metric code_smells) |"
            echo "| Cobertura (%) | $(metric coverage) |"
            echo "| Duplicación (%) | $(metric duplicated_lines_density) |"
            echo "| Líneas de código | $(metric ncloc) |"
            echo ""
            echo "Panel: $SONAR_HOST_URL/project/overview?id=${SONAR_PROJECT_KEY}"
          } | tee reports/sonar/resumen.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$bugs" != "0" ] || [ "$vulns" != "0" ] || [ "$hotspots" != "0" ]; then
            echo "::error::El código contiene bugs, vulnerabilidades o security hotspots pendientes."
            exit 1
          fi

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reporte-sonarcloud
          path: reports/sonar
          retention-days: 30
