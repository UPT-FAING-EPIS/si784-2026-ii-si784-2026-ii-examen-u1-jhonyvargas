# Entorno local completo: PostgreSQL + API (.NET) + Frontend (React servido por Nginx)
# Uso: copie .env.example a .env, ajuste los valores y ejecute "docker compose up --build"
services:
  db:
    image: postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_DB: subasta
      POSTGRES_USER: ${POSTGRES_USER:-subasta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d subasta"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=subasta;Username=${POSTGRES_USER:-subasta};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY en .env}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8081
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@subasta.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
    ports:
      - "8080:8080"

  web:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  pgdata:
